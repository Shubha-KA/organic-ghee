name: Deploy application

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - run: npm ci
        working-directory: functions/order-notifications
      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !.git
            !terraform
            !docs
          retention-days: 7

  deploy-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: app-dev
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app
          path: app
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy package with OIDC
        shell: bash
        run: |
          cd app
          zip -r ../app.zip .
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path ../app.zip \
            --type zip \
            --clean true
      - name: Deploy notification Function
        if: vars.AZURE_FUNCTIONAPP_NAME != ''
        shell: bash
        run: |
          cd app/functions/order-notifications
          zip -r ../../../function.zip .
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --src ../../../function.zip

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: build
    runs-on: [self-hosted, linux, prod-vnet]
    environment: prod
    concurrency:
      group: app-prod
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app
          path: app
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify private SCM resolution
        shell: bash
        run: |
          WEBAPP_IP="$(getent ahostsv4 "${{ vars.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net" | awk 'NR==1 {print $1}')"
          FUNCTION_IP="$(getent ahostsv4 "${{ vars.AZURE_FUNCTIONAPP_NAME }}.scm.azurewebsites.net" | awk 'NR==1 {print $1}')"
          [[ "$WEBAPP_IP" =~ ^10\. ]] || { echo "Web App SCM is not resolving privately."; exit 1; }
          [[ "$FUNCTION_IP" =~ ^10\. ]] || { echo "Function SCM is not resolving privately."; exit 1; }
      - name: Deploy Web App package through private SCM
        shell: bash
        run: |
          cd app
          zip -r ../app.zip . -x "functions/*"
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path ../app.zip \
            --type zip \
            --clean true
      - name: Deploy Function package through private SCM
        shell: bash
        run: |
          cd app/functions/order-notifications
          zip -r ../../../function.zip .
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --src ../../../function.zip
